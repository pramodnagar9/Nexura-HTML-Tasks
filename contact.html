
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

    <header>
        <h1>Contact Me</h1>
        <a href="index.html">Home</a>
    </header>

    <main>
        <h2>Get In Touch</h2>

        <p>If you have any questions or suggestions, feel free to contact me.</p>

        <form>

            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required>
            <br><br>

            <label for="message">Your Message:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="30"
                placeholder="Write your message here..." required></textarea>
            <br><br>

            <button type="submit">Send Message</button>
            <button type="reset">Reset</button>

        </form>

        <section>
            <h2>Connect With Me</h2>
            <p>GitHub: <a href="https://github.com/pramodnagar9" target="_blank">Visit GitHub</a></p>
            <p>Instagram: <a href="https://www.instagram.com/pramodnagar695" target="_blank">Visit Instagram</a></p>
        </section>
    </main>

    <footer>

    </footer>

</body>
</html>
